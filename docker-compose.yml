services:

  mus_us_db:
    image: postgres:15-alpine
    container_name: music_users_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - postgres_mus_us_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - "CMD-SHELL"
      - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost -p 5432"
      interval: 5s
      timeout: 5s
      retries: 10
  
  tg:
    build:
      context: ./tg
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: tg
    restart: on-failure

    depends_on:
      mus_us_db:
        condition: service_healthy
    command:
      - "sh"
      - "-c"
      - >
          until pg_isready -h mus_us_db -p 5432 -U ${POSTGRES_USER};
          do echo waiting for mus postgres; sleep 1; done;
          /app/bh_mus-bin 
    
    healthcheck:
      test:
      - "CMD-SHELL"
      - "curl -f http://localhost:${HEALTH_CHECK_PORT}/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
  
  parser:
    build:
      context: ./parser/camoufox_service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - UVICORN_HOST=${CAMOUFOX_HOST}
      - UVICORN_PORT=${CAMOUFOX_PORT_FOR_DOCKER}
    container_name: parser
    restart: on-failure
    stop_grace_period: 30s
  
    depends_on:
      tg:
        condition: service_healthy
    command:
      - uvicorn
      - camoufox_service.main:app
 
